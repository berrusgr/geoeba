name: GitHub Pages'e Dagit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ayni anda tek dagitim calissin; devam eden bir dagitimi iptal etme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # base_path ciktisi repo turune gore otomatik gelir:
      # proje sayfasinda '/repo-adi', kullanici kok sitesinde '/'.
      - name: Pages ayarlarini oku
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - run: npm ci

      - name: Statik export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}

      # Jekyll'in '_next' klasorunu yok saymasina karsi guvence.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

